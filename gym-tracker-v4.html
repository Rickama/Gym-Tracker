<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <meta name="theme-color" content="#0d0d0d">
  <title>GymTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg:#0d0d0d; --card:#111; --row:#1a1a1a; --border:#1e1e1e; --border2:#2a2a2a;
      --text:#e5e5e5; --muted:#555; --accent:#f97316; --pink:#ec4899; --green:#10b981;
      --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--text);font-family:'DM Mono','Courier New',monospace;min-height:100vh;overscroll-behavior:none}
    body{padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bottom) + 90px)}

    /* HEADER */
    .header{padding:calc(var(--safe-top) + 24px) 20px 0;max-width:600px;margin:0 auto}
    .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .date-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
    .progress-badge{font-size:10px;color:var(--muted);background:var(--row);padding:5px 12px;border-radius:20px;border:1px solid var(--border2)}
    .workout-title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;color:#fff;margin:8px 0 16px;cursor:pointer;line-height:1;word-break:break-word}
    .title-input{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:#fff;background:transparent;border:none;border-bottom:2px solid #fff;outline:none;width:100%;padding-bottom:2px;margin:8px 0 16px}
    .progress-bar-track{height:3px;background:var(--border);border-radius:2px;margin-bottom:22px;overflow:hidden}
    .progress-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .4s ease}

    /* CONTENT */
    .content{max-width:600px;margin:0 auto;padding:0 16px}

    /* MACRO AREA */
    .macro{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:opacity .2s,transform .15s}
    .macro.dragging{opacity:.4;transform:scale(.98)}
    .macro.drag-over{border-color:var(--accent);border-width:2px}
    .macro.collapsed .macro-body{display:none}
    .macro.collapsed .macro-header{border-bottom:none}

    .macro-header{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
    .macro-color-strip{width:5px;height:28px;border-radius:3px;flex-shrink:0}
    .macro-name-wrap{flex:1;min-width:0}
    .macro-name-input{background:transparent;border:none;border-bottom:1px solid transparent;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:#fff;width:100%;letter-spacing:.5px;padding:2px 0;transition:border-color .2s}
    .macro-name-input:focus{border-bottom-color:var(--accent)}
    .macro-meta{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px}
    .macro-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}

    /* ACTION BUTTONS — bigger touch targets */
    .act-btn{background:var(--row);border:1px solid var(--border2);color:var(--muted);font-size:16px;cursor:pointer;
      padding:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      line-height:1;transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
    .act-btn:active{background:#2a2a2a;color:var(--text)}
    .act-btn.danger:active{background:#2a0808;color:#ef4444;border-color:#ef4444}
    .act-btn.collapse-btn{font-size:14px}
    .collapse-arrow{display:inline-block;transition:transform .25s}
    .macro.collapsed .collapse-arrow{transform:rotate(-90deg)}

    .macro-body{padding:12px 12px 14px}

    /* EXERCISE CARD */
    .ex-card{background:#0f0f0f;border:1px solid var(--border2);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:opacity .2s,transform .15s}
    .ex-card.dragging{opacity:.4;transform:scale(.97)}
    .ex-card.drag-over{border-color:var(--accent);border-width:2px}

    .ex-header{display:flex;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--border);gap:8px}
    .ex-header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .ex-name{font-size:13px;font-weight:500;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-badge{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:8px;flex-shrink:0}
    .ex-header-right{display:flex;align-items:center;gap:4px;flex-shrink:0}

    /* Smaller action buttons inside exercise cards */
    .ex-act-btn{background:var(--row);border:1px solid var(--border2);color:var(--muted);font-size:16px;cursor:pointer;
      width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:background .15s,color .15s}
    .ex-act-btn:active{background:#2a2a2a;color:var(--text)}
    .ex-act-btn.danger:active{background:#2a0808;color:#ef4444}
    .ex-act-btn.handle{cursor:grab;font-size:18px;touch-action:none}
    .ex-act-btn.handle:active{cursor:grabbing}

    /* SET TABLE */
    .set-cols{display:grid;grid-template-columns:28px 1fr 1fr 40px 36px;padding:7px 14px 3px;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center}
    .set-cols span:first-child{text-align:left}
    .set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px 36px;padding:3px 14px;transition:background .2s}
    .set-row.done{background:#091a0b}
    .set-num{font-size:10px;color:var(--muted);display:flex;align-items:center}
    .set-input-wrap{background:var(--row);border-radius:6px;margin:3px 3px;padding:8px 5px}
    .set-input{background:transparent;border:none;outline:none;font-family:inherit;color:var(--text);font-size:15px;width:100%;text-align:center;-moz-appearance:textfield}
    .set-input::-webkit-inner-spin-button,.set-input::-webkit-outer-spin-button{-webkit-appearance:none}
    .set-input::placeholder{color:#333}

    /* Check button — bigger */
    .set-check{background:none;border:2px solid var(--border2);border-radius:7px;width:34px;height:34px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;align-self:center;font-size:15px;
      transition:all .15s;flex-shrink:0;color:transparent}
    .set-check.checked{background:var(--green);border-color:var(--green);color:#fff}
    .set-check:active{transform:scale(.85)}

    /* Del set button — bigger */
    .del-set-btn{background:none;border:none;color:#ef4444;font-size:18px;cursor:pointer;
      opacity:.2;padding:0;align-self:center;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
    .del-set-btn:active{opacity:1}

    /* Add set button — bigger */
    .add-set-btn{display:block;width:100%;margin-top:8px;padding:10px 0;background:transparent;
      border:1px dashed var(--border2);border-radius:8px;color:var(--muted);font-family:inherit;
      font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
    .add-set-btn:active{background:#1a1a1a}
    .card-footer{padding:8px 14px 12px}
    .aerobic-note{margin:6px 14px 0;padding:7px 12px;background:#0a1a0f;border:1px solid #10b98133;border-radius:8px;font-size:10px;color:#10b981;letter-spacing:1px;display:flex;align-items:center;gap:6px}

    /* ADD EXERCISE INSIDE MACRO */
    .add-ex-trigger-small{width:100%;background:transparent;border:1px dashed #252525;color:#3a3a3a;
      border-radius:10px;padding:13px;cursor:pointer;font-family:inherit;font-size:10px;
      letter-spacing:2px;text-transform:uppercase;margin-top:6px}
    .add-ex-trigger-small:active{border-color:var(--border2);color:var(--muted)}

    /* ADD EXERCISE FORM */
    .add-ex-form{background:#0d0d0d;border:1px solid var(--border2);border-radius:12px;padding:16px;margin-top:10px}
    .form-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
    .form-input{background:var(--row);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);width:100%;outline:none;margin-bottom:10px}
    .cat-pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
    .cat-pill{background:var(--row);border:1px solid var(--border2);color:#555;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:inherit}
    .form-actions{display:flex;gap:8px}
    .btn-primary{flex:1;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:13px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:500}
    .btn-primary:active{background:#ccc}
    .btn-secondary{flex:1;background:var(--row);color:#888;border:1px solid var(--border2);border-radius:8px;padding:13px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase}
    .btn-secondary:active{background:#222}

    /* ADD MACRO */
    .add-macro-btn{width:100%;background:transparent;border:1px dashed var(--border2);color:var(--muted);
      border-radius:14px;padding:18px;cursor:pointer;font-family:inherit;font-size:12px;
      letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
    .add-macro-btn:active{border-color:#555;color:#888}

    /* CIRCUIT */
    .circuit-divider{background:#0a1a14;border:1px solid #10b98144;border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px}

    /* NOTES */
    .notes-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
    .notes-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
    .notes-textarea{width:100%;background:transparent;border:none;outline:none;font-family:inherit;color:#888;font-size:13px;resize:none;line-height:1.6}

    /* SAVE / RESET */
    .save-btn{width:100%;background:var(--row);color:var(--text);border:1px solid #333;border-radius:12px;padding:17px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:4px;text-transform:uppercase;transition:background .2s,color .2s;margin-bottom:10px}
    .save-btn:active{background:var(--text);color:var(--bg)}
    .reset-btn{width:100%;background:transparent;color:#2a2a2a;border:1px solid #1a1a1a;border-radius:12px;padding:13px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
    .reset-btn:active{color:#ef4444;border-color:#ef4444}

    /* UNDO BUTTON */
    .undo-fab{position:fixed;bottom:calc(var(--safe-bottom) + 20px);right:16px;z-index:200;
      background:#1e1e1e;border:1px solid #333;color:var(--text);border-radius:50px;
      padding:12px 18px;font-family:inherit;font-size:11px;letter-spacing:2px;
      cursor:pointer;display:flex;align-items:center;gap:8px;
      box-shadow:0 4px 20px rgba(0,0,0,.6);transition:opacity .25s,transform .2s;opacity:0;pointer-events:none}
    .undo-fab.visible{opacity:1;pointer-events:all}
    .undo-fab:active{background:#333;transform:scale(.95)}
    .undo-count{background:var(--accent);color:#000;border-radius:10px;font-size:9px;
      padding:2px 7px;font-weight:700;letter-spacing:0}

    /* INSTALL */
    .install-banner{position:fixed;bottom:calc(var(--safe-bottom) + 10px);left:16px;right:16px;background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:slideUp .4s ease}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .install-text strong{display:block;font-size:11px;color:var(--text);letter-spacing:1px;margin-bottom:2px}
    .install-text span{font-size:10px;color:var(--muted)}
    .install-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:6px;margin-left:auto}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="date-label" id="dateLabel"></span>
    <span class="progress-badge" id="progressBadge">0/0 set</span>
  </div>
  <div id="titleWrap"></div>
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="content">
  <div id="macroList"></div>
  <button class="add-macro-btn" id="addMacroBtn">+ Nuova area di allenamento</button>
  <div class="notes-card">
    <div class="notes-label">Note</div>
    <textarea class="notes-textarea" id="notesArea" rows="3" placeholder="Aggiungi note..."></textarea>
  </div>
  <button class="save-btn" onclick="saveWorkout()">Salva allenamento (PDF)</button>
  <button class="reset-btn" onclick="resetWorkout()">Azzera allenamento</button>
</div>

<button class="undo-fab" id="undoFab" onclick="undo()">
  ↩ Annulla <span class="undo-count" id="undoCount">0</span>
</button>

<div class="install-banner" id="installBanner" style="display:none">
  <span style="font-size:22px">📲</span>
  <div class="install-text">
    <strong>Aggiungi alla Home</strong>
    <span>Condividi → "Aggiungi a schermata Home"</span>
  </div>
  <button class="install-close" id="installClose">×</button>
</div>

<script>
const STORAGE_KEY = "gymtracker_v2";
const CAT_COLORS = {
  gambe:"#f97316",petto:"#3b82f6",schiena:"#10b981",spalle:"#a855f7",
  braccia:"#ec4899",tricipiti:"#3b82f6",core:"#eab308",cardio:"#ef4444",circuito:"#10b981"
};
const MACRO_PALETTE = ["#f97316","#3b82f6","#10b981","#a855f7","#ec4899","#eab308","#ef4444","#06b6d4","#84cc16"];
const CATEGORIES = ["gambe","petto","schiena","spalle","braccia","tricipiti","core","cardio"];
const AEROBIC_KW = ["rich.","richiamo"];

const DEFAULT_DATA = {
  workoutName:"Le mie schede", notes:"", nextId:500,
  macros:[{
    id:1, name:"Gambe e Tricipiti", color:"#f97316", collapsed:false,
    exercises:[
      {id:10,name:"Leg Press",              category:"gambe",     sets:[{r:12,w:"",done:false},{r:12,w:"",done:false},{r:10,w:"",done:false},{r:10,w:"",done:false},{r:10,w:"",done:false}]},
      {id:11,name:"Leg Curl",               category:"gambe",     sets:[{r:10,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false}]},
      {id:12,name:"Calf Machine",           category:"gambe",     sets:[{r:10,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false}]},
      {id:13,name:"Tricipiti Poliercolina", category:"tricipiti", sets:[{r:12,w:"",done:false},{r:10,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false}]},
      {id:14,name:"Tricipiti Pol. 90°",     category:"tricipiti", sets:[{r:10,w:"",done:false},{r:8,w:"",done:false},{r:8,w:"",done:false}]},
      {id:15,name:"Rich. Chest Press",      category:"petto",     sets:[{r:12,w:"",done:false},{r:12,w:"",done:false},{r:12,w:"",done:false},{r:12,w:"",done:false}]},
      {id:16,name:"Rich. Alzate Laterali",  category:"spalle",    sets:[{r:12,w:"",done:false},{r:12,w:"",done:false},{r:12,w:"",done:false}]},
    ],
    circuit:[
      {id:101,name:"Alzate Gambe",    category:"circuito",sets:[{r:"MAX",w:"",done:false},{r:"MAX",w:"",done:false},{r:"MAX",w:"",done:false},{r:"MAX",w:"",done:false}]},
      {id:102,name:"Rotazione Busto", category:"circuito",sets:[{r:20,w:"",done:false},{r:20,w:"",done:false},{r:20,w:"",done:false},{r:20,w:"",done:false}]},
      {id:103,name:"2' Aerobico",     category:"circuito",sets:[{r:"2min",w:"",done:false},{r:"2min",w:"",done:false},{r:"2min",w:"",done:false},{r:"2min",w:"",done:false}]},
    ]
  }]
};

// ── State ─────────────────────────────────────────────────────────────────────
let state;
let editingTitle = false;
let addFormState = {};
// drag state
let dragType = null; // 'macro' | 'ex'
let dragMacroIdx = null;
let dragExMacroId = null;
let dragExIdx = null;

// ── Undo stack ────────────────────────────────────────────────────────────────
const MAX_UNDO = 20;
let undoStack = [];

function snapshot() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoBtn();
}

function undo() {
  if (!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  persist(); updateUndoBtn(); render();
}

function updateUndoBtn() {
  const fab = document.getElementById("undoFab");
  const cnt = document.getElementById("undoCount");
  if (!fab) return;
  if (undoStack.length > 0) {
    fab.classList.add("visible");
    cnt.textContent = undoStack.length;
  } else {
    fab.classList.remove("visible");
  }
}

// ── Persist ───────────────────────────────────────────────────────────────────
function persist() {
  state.notes = document.getElementById("notesArea")?.value ?? state.notes;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { state = JSON.parse(raw); return; }
  } catch(e){}
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function resetWorkout() {
  snapshot(); // save before reset
  state.macros.forEach(m => [...m.exercises,...m.circuit].forEach(ex => ex.sets.forEach(s=>{s.w="";s.done=false;})));
  persist(); render();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function isAerobic(name){const n=name.toLowerCase();return AEROBIC_KW.some(k=>n.startsWith(k));}
function getMacro(mid){return state.macros.find(m=>m.id===mid);}
function getEx(mid,eid){const m=getMacro(mid);if(!m)return null;return m.exercises.find(e=>e.id===eid)||m.circuit.find(e=>e.id===eid);}
function nextColor(){return MACRO_PALETTE[state.macros.length % MACRO_PALETTE.length];}
function hexToRgb(hex){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return r?[parseInt(r[1],16),parseInt(r[2],16),parseInt(r[3],16)]:null;}

function countProgress(){
  let done=0,total=0;
  state.macros.forEach(m=>[...m.exercises,...m.circuit].forEach(ex=>ex.sets.forEach(s=>{total++;if(s.done)done++;})));
  return{done,total};
}
function updateProgress(){
  const{done,total}=countProgress();
  document.getElementById("progressBadge").textContent=`${done}/${total} set`;
  document.getElementById("progressFill").style.width=total>0?`${(done/total)*100}%`:"0%";
}

// ── Date ─────────────────────────────────────────────────────────────────────
document.getElementById("dateLabel").textContent =
  new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  renderTitle();
  renderMacros();
  const ta=document.getElementById("notesArea");
  if(ta){ta.value=state.notes;ta.oninput=()=>{state.notes=ta.value;persist();};}
  updateProgress();
  updateUndoBtn();
}

function renderTitle(){
  const wrap=document.getElementById("titleWrap");
  if(editingTitle){
    wrap.innerHTML=`<input class="title-input" id="nameInput" value="${state.workoutName.replace(/"/g,'&quot;')}" autocomplete="off">`;
    const inp=document.getElementById("nameInput");
    inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
    inp.onblur=()=>{state.workoutName=inp.value.trim()||state.workoutName;editingTitle=false;persist();render();};
    inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();};
  } else {
    wrap.innerHTML=`<h1 class="workout-title">${state.workoutName}</h1>`;
    wrap.querySelector("h1").onclick=()=>{editingTitle=true;render();};
  }
}

// ── Build HTML ────────────────────────────────────────────────────────────────
function renderMacros(){
  const list=document.getElementById("macroList");
  list.innerHTML=state.macros.map((m,mi)=>buildMacroHtml(m,mi)).join("");
  bindAll();
  document.getElementById("addMacroBtn").onclick=()=>{
    snapshot();
    const nm={id:++state.nextId,name:"Nuova scheda",color:nextColor(),collapsed:false,exercises:[],circuit:[]};
    state.macros.push(nm);
    persist();render();
    setTimeout(()=>{const i=document.querySelector(`[data-mni="${nm.id}"]`);if(i){i.focus();i.select();}},60);
  };
}

function buildMacroHtml(m,mi){
  const col=m.collapsed?"collapsed":"";
  const allEx=[...m.exercises,...m.circuit];
  const done=allEx.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  const tot=allEx.reduce((a,ex)=>a+ex.sets.length,0);

  const body=
    m.exercises.map((ex,ei)=>buildExHtml(ex,false,m.id,ei)).join("")+
    (m.circuit.length?`<div class="circuit-divider"><span style="font-size:15px">🔄</span><div style="font-size:11px;color:#10b981;letter-spacing:2px;font-weight:500">CIRCUITO × 4</div></div>`:"") +
    m.circuit.map((ex,ei)=>buildExHtml(ex,true,m.id,ei)).join("")+
    buildAddFormHtml(m);

  return `
<div class="macro ${col}" id="macro-${m.id}" data-mi="${mi}" data-mid="${m.id}">
  <div class="macro-header" data-mid="${m.id}">
    <div class="macro-color-strip" style="background:${m.color}"></div>
    <div class="macro-name-wrap">
      <input class="macro-name-input" data-mni="${m.id}" value="${m.name.replace(/"/g,'&quot;')}" placeholder="Nome scheda">
      <div class="macro-meta">${m.exercises.length+m.circuit.length} esercizi · ${done}/${tot} set</div>
    </div>
    <div class="macro-actions">
      <button class="act-btn" data-mup="${m.id}" title="Sposta su">↑</button>
      <button class="act-btn" data-mdown="${m.id}" title="Sposta giù">↓</button>
      <button class="act-btn danger" data-mdel="${m.id}" title="Elimina">🗑</button>
      <button class="act-btn collapse-btn" data-mcoll="${m.id}" title="Espandi/Riduci"><span class="collapse-arrow">›</span></button>
    </div>
  </div>
  <div class="macro-body">${body}</div>
</div>`;
}

function buildExHtml(ex,isCircuit,macroId,exIdx){
  const color=CAT_COLORS[ex.category]||"#888";
  const aerobic=isAerobic(ex.name);
  const sets=ex.sets.map((s,i)=>{
    const isRO=isCircuit&&typeof s.r==="string"&&isNaN(s.r);
    return `<div class="set-row ${s.done?'done':''}" data-mid="${macroId}" data-eid="${ex.id}" data-si="${i}">
      <span class="set-num" style="${s.done?'color:#10b981':''}">${i+1}</span>
      <div class="set-input-wrap"><input class="set-input" type="${isCircuit?'text':'number'}" inputmode="${isCircuit?'text':'decimal'}"
        placeholder="—" value="${s.r??''}" data-mid="${macroId}" data-eid="${ex.id}" data-si="${i}" data-field="r"
        ${isRO?'readonly':''}></div>
      <div class="set-input-wrap"><input class="set-input" type="${isCircuit?'text':'number'}" inputmode="${isCircuit?'text':'decimal'}"
        placeholder="—" value="${s.w??''}" data-mid="${macroId}" data-eid="${ex.id}" data-si="${i}" data-field="w"
        ${isCircuit?'readonly style="color:#2a2a2a;pointer-events:none"':''}></div>
      <button class="set-check ${s.done?'checked':''}" data-mid="${macroId}" data-eid="${ex.id}" data-si="${i}">✓</button>
      <button class="del-set-btn" data-mid="${macroId}" data-eid="${ex.id}" data-si="${i}">×</button>
    </div>`;
  }).join("");

  const dragAttrs=!isCircuit?`data-ex-mi="${exIdx}" data-ex-mid="${macroId}"`:'';
  return `
<div class="ex-card" id="ex-${ex.id}" ${dragAttrs}>
  <div class="ex-header">
    <div class="ex-header-left">
      <div class="cat-dot" style="background:${color}"></div>
      <span class="ex-name">${ex.name}</span>
      <span class="cat-badge" style="color:${color};background:${color}22">${ex.category}</span>
    </div>
    <div class="ex-header-right">
      ${!isCircuit?`<button class="ex-act-btn handle" data-exhandle="${ex.id}" data-ex-mid="${macroId}" title="Tieni premuto e trascina">⠿</button>`:''}
      ${!isCircuit?`<button class="ex-act-btn danger" data-exdel="${ex.id}" data-exdel-mid="${macroId}">×</button>`:''}
    </div>
  </div>
  ${aerobic?`<div class="aerobic-note">🏃 Dopo l'esercizio: 2' aerobico</div>`:''}
  <div class="set-cols"><span>SET</span><span>REPS</span><span>KG</span><span>✓</span><span></span></div>
  ${sets}
  <div class="card-footer">${!isCircuit?`<button class="add-set-btn" data-addset="${ex.id}" data-addset-mid="${macroId}">+ Aggiungi set</button>`:''}</div>
</div>`;
}

function buildAddFormHtml(m){
  const fs=addFormState[m.id]||{};
  if(!fs.show) return `<button class="add-ex-trigger-small" data-showadd="${m.id}">+ Aggiungi esercizio</button>`;
  const cat=fs.cat||"gambe";
  const pills=CATEGORIES.map(c=>{
    const col=CAT_COLORS[c]||"#888",active=c===cat;
    return `<button class="cat-pill" data-pickcat="${c}" data-pickmid="${m.id}"
      style="${active?`background:${col}22;border-color:${col};color:${col}`:''}"> ${c}</button>`;
  }).join("");
  return `<div class="add-ex-form">
    <div class="form-label">Nuovo esercizio</div>
    <input class="form-input" id="newex-${m.id}" placeholder="Nome esercizio" value="${(fs.name||'').replace(/"/g,'&quot;')}" autocomplete="off">
    <div class="cat-pills">${pills}</div>
    <div class="form-actions">
      <button class="btn-primary" data-confirmex="${m.id}">Aggiungi</button>
      <button class="btn-secondary" data-cancelex="${m.id}">Annulla</button>
    </div>
  </div>`;
}

// ── Bind all events ───────────────────────────────────────────────────────────
function bindAll(){

  // ── Macro: collapse (click on header area, not buttons) ──
  document.querySelectorAll(".macro-header").forEach(hdr=>{
    hdr.addEventListener("click",e=>{
      if(e.target.closest(".macro-actions")) return;
      if(e.target.tagName==="INPUT") return;
      const mid=+hdr.dataset.mid;
      const m=getMacro(mid);if(!m)return;
      m.collapsed=!m.collapsed;persist();renderMacros();
    });
  });

  // ── Macro: collapse button ──
  document.querySelectorAll("[data-mcoll]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const mid=+btn.dataset.mcoll,m=getMacro(mid);if(!m)return;
      m.collapsed=!m.collapsed;persist();renderMacros();
    });
  });

  // ── Macro: name edit ──
  document.querySelectorAll("[data-mni]").forEach(inp=>{
    inp.addEventListener("click",e=>e.stopPropagation());
    inp.addEventListener("input",e=>{
      const m=getMacro(+inp.dataset.mni);if(m)m.name=inp.value;persist();
      // update meta inline
      const meta=inp.closest(".macro-name-wrap")?.querySelector(".macro-meta");
      // will update on next render
    });
  });

  // ── Macro: move up ──
  document.querySelectorAll("[data-mup]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const mid=+btn.dataset.mup,idx=state.macros.findIndex(m=>m.id===mid);
      if(idx>0){[state.macros[idx-1],state.macros[idx]]=[state.macros[idx],state.macros[idx-1]];persist();renderMacros();}
    });
  });

  // ── Macro: move down ──
  document.querySelectorAll("[data-mdown]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const mid=+btn.dataset.mdown,idx=state.macros.findIndex(m=>m.id===mid);
      if(idx<state.macros.length-1){[state.macros[idx],state.macros[idx+1]]=[state.macros[idx+1],state.macros[idx]];persist();renderMacros();}
    });
  });

  // ── Macro: delete ──
  document.querySelectorAll("[data-mdel]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const mid=+btn.dataset.mdel;
      snapshot();
      state.macros=state.macros.filter(x=>x.id!==mid);persist();renderMacros();
    });
  });

  // ── Set inputs ──
  document.querySelectorAll(".set-input[data-field]").forEach(inp=>{
    inp.addEventListener("input",e=>{
      const mid=+e.target.dataset.mid,eid=+e.target.dataset.eid,si=+e.target.dataset.si,field=e.target.dataset.field;
      const ex=getEx(mid,eid);if(ex){ex.sets[si][field]=e.target.value;persist();updateProgress();}
    });
  });

  // ── Set check ──
  document.querySelectorAll(".set-check").forEach(btn=>{
    btn.addEventListener("click",e=>{
      const mid=+btn.dataset.mid,eid=+btn.dataset.eid,si=+btn.dataset.si;
      const ex=getEx(mid,eid);if(!ex)return;
      ex.sets[si].done=!ex.sets[si].done;
      const row=btn.closest(".set-row");
      row.classList.toggle("done",ex.sets[si].done);
      btn.classList.toggle("checked",ex.sets[si].done);
      row.querySelector(".set-num").style.color=ex.sets[si].done?"#10b981":"";
      persist();updateProgress();
      // update macro meta
      const m=getMacro(mid);
      const metaEl=document.querySelector(`[data-mni="${mid}"]`)?.closest(".macro-name-wrap")?.querySelector(".macro-meta");
      if(metaEl&&m){
        const allEx=[...m.exercises,...m.circuit];
        const d=allEx.reduce((a,x)=>a+x.sets.filter(s=>s.done).length,0);
        const t=allEx.reduce((a,x)=>a+x.sets.length,0);
        metaEl.textContent=`${m.exercises.length+m.circuit.length} esercizi · ${d}/${t} set`;
      }
    });
  });

  // ── Del set ──
  document.querySelectorAll(".del-set-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.mid,eid=+btn.dataset.eid,si=+btn.dataset.si;
      const m=getMacro(mid);if(!m)return;
      const ex=m.exercises.find(e=>e.id===eid);
      if(ex&&ex.sets.length>1){snapshot();ex.sets.splice(si,1);persist();renderMacros();}
    });
  });

  // ── Add set ──
  document.querySelectorAll("[data-addset]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.addsetMid,eid=+btn.dataset.addset;
      const m=getMacro(mid);if(!m)return;
      const ex=m.exercises.find(e=>e.id===eid);
      if(ex){ex.sets.push({r:"",w:"",done:false});persist();renderMacros();}
    });
  });

  // ── Del exercise ──
  document.querySelectorAll("[data-exdel]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const mid=+btn.dataset.exdelMid,eid=+btn.dataset.exdel;
      snapshot();
      const m=getMacro(mid);if(!m)return;
      m.exercises=m.exercises.filter(e=>e.id!==eid);persist();renderMacros();
    });
  });

  // ── Show add exercise form ──
  document.querySelectorAll("[data-showadd]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.showadd;
      addFormState[mid]={show:true,name:"",cat:"gambe"};
      renderMacros();
      setTimeout(()=>{const i=document.getElementById(`newex-${mid}`);if(i)i.focus();},50);
    });
  });

  // ── Cat pill ──
  document.querySelectorAll("[data-pickcat]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.pickmid;
      const inp=document.getElementById(`newex-${mid}`);
      if(!addFormState[mid])addFormState[mid]={};
      addFormState[mid].name=inp?.value||"";
      addFormState[mid].cat=btn.dataset.pickcat;
      addFormState[mid].show=true;
      renderMacros();
      setTimeout(()=>{const i=document.getElementById(`newex-${mid}`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},40);
    });
  });

  // ── Confirm add exercise ──
  document.querySelectorAll("[data-confirmex]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.confirmex;
      const inp=document.getElementById(`newex-${mid}`);
      const name=inp?.value.trim()||"";if(!name)return;
      const m=getMacro(mid);if(!m)return;
      snapshot();
      m.exercises.push({id:++state.nextId,name,category:addFormState[mid]?.cat||"gambe",sets:[{r:"",w:"",done:false},{r:"",w:"",done:false},{r:"",w:"",done:false}]});
      addFormState[mid]={show:false};persist();renderMacros();
    });
  });

  // ── Cancel add exercise ──
  document.querySelectorAll("[data-cancelex]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const mid=+btn.dataset.cancelex;addFormState[mid]={show:false};renderMacros();
    });
  });

  // ── Form input keydown ──
  document.querySelectorAll(".add-ex-form .form-input").forEach(inp=>{
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){const mid=inp.id.replace("newex-","");document.querySelector(`[data-confirmex="${mid}"]`)?.click();}
    });
    inp.addEventListener("input",e=>{
      const mid=inp.id.replace("newex-","");
      if(!addFormState[mid])addFormState[mid]={};
      addFormState[mid].name=inp.value;
    });
  });

  // ── DRAG & DROP: MACROS (↑↓ buttons already handle mobile; drag for desktop) ──
  document.querySelectorAll(".macro").forEach(el=>{
    el.addEventListener("dragstart",e=>{
      // only drag from the header strip area, not from inner content
      if(e.target.closest(".macro-body"))return;
      dragType="macro";dragMacroIdx=+el.dataset.mi;
      setTimeout(()=>el.classList.add("dragging"),0);
      e.dataTransfer.effectAllowed="move";
    });
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    el.addEventListener("dragover",e=>{
      if(dragType!=="macro")return;
      e.preventDefault();el.classList.add("drag-over");
    });
    el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));
    el.addEventListener("drop",e=>{
      e.preventDefault();el.classList.remove("drag-over");
      if(dragType!=="macro")return;
      const ti=+el.dataset.mi,si=dragMacroIdx;
      if(si!==ti&&si!=null){snapshot();const m=state.macros.splice(si,1)[0];state.macros.splice(ti,0,m);}
      dragType=null;persist();renderMacros();
    });
  });

  // ── DRAG & DROP: EXERCISES via handle (touch + mouse) ──
  document.querySelectorAll("[data-exhandle]").forEach(handle=>{
    const card=handle.closest(".ex-card");
    if(!card)return;
    const macroId=+handle.dataset.exMid;

    // ── Desktop mouse drag from handle ──
    handle.setAttribute("draggable","true");
    handle.addEventListener("dragstart",e=>{
      e.stopPropagation();
      dragType="ex";
      dragExMacroId=macroId;
      dragExIdx=+card.dataset.exMi;
      setTimeout(()=>card.classList.add("dragging"),0);
      e.dataTransfer.effectAllowed="move";
    });
    handle.addEventListener("dragend",e=>{
      e.stopPropagation();
      card.classList.remove("dragging");
    });

    // ── Touch drag ──
    let touchStartY=0,touchMoved=false;
    handle.addEventListener("touchstart",e=>{
      e.preventDefault();
      dragType="ex";
      dragExMacroId=macroId;
      dragExIdx=+card.dataset.exMi;
      touchStartY=e.touches[0].clientY;
      touchMoved=false;
      card.classList.add("dragging");
    },{passive:false});

    handle.addEventListener("touchmove",e=>{
      e.preventDefault();touchMoved=true;
      // highlight target
      document.querySelectorAll(".ex-card").forEach(c=>c.classList.remove("drag-over"));
      const t=e.touches[0];
      const els=document.elementsFromPoint(t.clientX,t.clientY);
      const target=els.find(el=>el.classList.contains("ex-card")&&el!==card&&el.dataset.exMid==macroId);
      if(target)target.classList.add("drag-over");
    },{passive:false});

    handle.addEventListener("touchend",e=>{
      card.classList.remove("dragging");
      document.querySelectorAll(".ex-card").forEach(c=>c.classList.remove("drag-over"));
      if(!touchMoved){dragType=null;return;}
      const t=e.changedTouches[0];
      const els=document.elementsFromPoint(t.clientX,t.clientY);
      const target=els.find(el=>el.classList.contains("ex-card")&&el!==card&&el.dataset.exMid==macroId);
      if(target){
        snapshot();
        const m=getMacro(macroId);
        const ti=+target.dataset.exMi,si=dragExIdx;
        if(m&&si!==ti){const ex=m.exercises.splice(si,1)[0];m.exercises.splice(ti,0,ex);}
        persist();renderMacros();
      }
      dragType=null;
    });
  });

  // ── Drop targets for ex cards ──
  document.querySelectorAll(".ex-card[data-ex-mid]").forEach(el=>{
    el.addEventListener("dragover",e=>{
      if(dragType!=="ex")return;
      e.preventDefault();e.stopPropagation();
      el.classList.add("drag-over");
    });
    el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));
    el.addEventListener("drop",e=>{
      e.preventDefault();e.stopPropagation();
      el.classList.remove("drag-over");
      if(dragType!=="ex")return;
      const macroId=+el.dataset.exMid,ti=+el.dataset.exMi,si=dragExIdx;
      if(macroId===dragExMacroId&&si!==ti){
        snapshot();
        const m=getMacro(macroId);
        if(m){const ex=m.exercises.splice(si,1)[0];m.exercises.splice(ti,0,ex);}
        persist();renderMacros();
      }
      dragType=null;
    });
  });
}

// ── Save PDF ──────────────────────────────────────────────────────────────────
function saveWorkout(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const pageW=210,margin=14,colW=pageW-margin*2;let y=20;
  const date=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const CAT_RGB={gambe:[249,115,22],petto:[59,130,246],schiena:[16,185,129],spalle:[168,85,247],
    braccia:[236,72,153],tricipiti:[59,130,246],core:[234,179,8],cardio:[239,68,68],circuito:[16,185,129]};
  doc.setFillColor(13,13,13);doc.rect(0,0,pageW,36,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(255,255,255);
  doc.text(state.workoutName.toUpperCase(),margin,y);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120,120,120);
  doc.text(date,margin,y+8);y=44;
  state.macros.forEach(m=>{
    if(y+12>280){doc.addPage();y=20;}
    const[r,g,b]=hexToRgb(m.color)||[249,115,22];
    doc.setFillColor(r,g,b);doc.rect(margin,y,colW,8,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(255,255,255);
    doc.text(m.name.toUpperCase(),margin+3,y+5.5);y+=11;
    [...m.exercises,...m.circuit].forEach((ex,ei)=>{
      const isC=m.circuit.includes(ex);
      const rgb=CAT_RGB[ex.category]||[136,136,136];
      const bh=10+ex.sets.length*7+4;
      if(y+bh>280){doc.addPage();y=20;}
      if(isC&&ei===m.exercises.length){
        doc.setFillColor(10,26,20);doc.rect(margin,y,colW,7,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(16,185,129);
        doc.text("CIRCUITO x4",margin+3,y+5);y+=9;
      }
      doc.setFillColor(...rgb);doc.rect(margin,y,2,bh-3,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(220,220,220);
      doc.text(ex.name.toUpperCase(),margin+5,y+5);
      doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...rgb);
      doc.text(ex.category.toUpperCase(),margin+5+doc.getTextWidth(ex.name.toUpperCase())+3,y+5);
      y+=9;
      doc.setFontSize(7);doc.setTextColor(90,90,90);
      doc.text("SET",margin+5,y);doc.text("REPS",margin+28,y);
      if(!isC)doc.text("KG",margin+55,y);doc.text("✓",margin+80,y);y+=5;
      ex.sets.forEach((s,i)=>{
        doc.setFillColor(s.done?10:i%2===0?26:20,s.done?40:i%2===0?26:20,s.done?15:i%2===0?26:20);
        doc.rect(margin+3,y-4,colW-3,6.5,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(8);
        doc.setTextColor(150,150,150);doc.text(String(i+1),margin+5,y);
        doc.setTextColor(220,220,220);doc.text(String(s.r??"-"),margin+28,y);
        if(!isC){doc.setTextColor(s.w?249:70,s.w?115:70,s.w?22:70);doc.text(s.w?String(s.w)+" kg":"—",margin+55,y);}
        doc.setTextColor(s.done?16:50,s.done?185:50,s.done?129:50);doc.text(s.done?"✓":"○",margin+80,y);
        y+=7;
      });y+=3;
    });y+=5;
  });
  const nv=(document.getElementById("notesArea")||{}).value||"";
  if(nv.trim()){if(y+20>280){doc.addPage();y=20;}
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(100,100,100);
    doc.text("NOTE",margin,y+5);y+=10;
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(170,170,170);
    doc.text(doc.splitTextToSize(nv,colW),margin,y);
  }
  doc.save(`allenamento-${new Date().toISOString().slice(0,10)}.pdf`);
}

  document.getElementById("installBanner").style.display="none";
